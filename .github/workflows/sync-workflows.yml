name: Sync workflows to n8n

on:
  push:
    branches: [main]
    paths: ['src/workflows/**']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install n8n CLI
        run: npm install -g @n8n/cli

      - name: Sync workflows (upsert by name)
        run: ./scripts/sync-workflows.sh --publish
        env:
          N8N_URL: ${{ vars.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
